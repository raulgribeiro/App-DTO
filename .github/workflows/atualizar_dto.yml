name: Atualizar DTO Dashboard

on:
  push:
    branches:
      - main
      
  schedule:
    - cron: '*/15 * * * *' # Alterado para 15 minutos (mínimo seguro no GitHub)

  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # 1. Clona o repositório
      - name: Checkout repositório
        uses: actions/checkout@v4

      # 2. Configura Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala dependências
      - name: Instalar dependências
        run: pip install openpyxl requests

      # 4. Roda o script (apenas baixa e atualiza os arquivos locais)
      - name: Atualizar dashboard DTO
        env:
          DTO_SHAREPOINT_URL: ${{ secrets.DTO_SHAREPOINT_URL }}
          CRACHA_SHAREPOINT_URL: ${{ secrets.CRACHA_SHAREPOINT_URL }}
        run: python atualizar_DTO.py

      # 5. Salva as alterações de volta no repositório com segurança
      - name: Commit e Push das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          # O comando abaixo evita que o workflow falhe se o script rodar e não houver nenhuma alteração nas planilhas
          git diff-index --quiet HEAD || git commit -m "Bot: Atualização automática do Dashboard [skip ci]"
          git push
