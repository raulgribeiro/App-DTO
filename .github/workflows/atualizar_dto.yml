name: Atualizar DTO Dashboard

on:
  push:
    branches:
      - main
      
  schedule:
    # O GitHub limita a frequência de agendamentos. 
    # Alterado para 15 minutos (mínimo seguro para evitar bloqueios ou atrasos).
    - cron: '*/15 * * * *'

  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Permissão explícita para que o fluxo possa fazer o Push

    steps:
      # 1. Clona o repositório
      - name: Checkout repositório
        uses: actions/checkout@v4

      # 2. Configura Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Instala dependências
      - name: Instalar dependências
        run: pip install openpyxl requests

      # 4. Configura a identidade do git no ambiente virtual
      - name: Configurar identidade do git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

      # 5. Injeta o token de autenticação no repositório local e roda o script
      - name: Atualizar dashboard DTO
        env:
          DTO_SHAREPOINT_URL: ${{ secrets.DTO_SHAREPOINT_URL }}
          CRACHA_SHAREPOINT_URL: ${{ secrets.CRACHA_SHAREPOINT_URL }}
        run: |
          # Configura o token secreto do GitHub para dar permissão de escrita ao comando 'git push' interno do script
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git
          python atualizar_DTO.py
