name: Atualizar DTO Dashboard

on:
  schedule:
    - cron: '15 18 * * *'
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install openpyxl requests

      - name: Configurar identidade do git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Atualizar dashboard DTO
        env:
          DTO_SHAREPOINT_URL: ${{ secrets.DTO_SHAREPOINT_URL }}
          CRACHA_SHAREPOINT_URL: ${{ secrets.CRACHA_SHAREPOINT_URL }}
        run: python atualizar_DTO.py
